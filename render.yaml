services:
  - type: web
    name: ridepool-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
